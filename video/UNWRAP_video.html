<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNWRAP Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#243049; --paper:#fbf5e8; --coral:#ff7f63; --mint:#3fbf98; --sky:#4fb0ee; --lemon:#ffd25a; --lilac:#a58af0; --pink:#ff8fb1; --mute:#6b7894;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e8e1d0;color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column}
#viewport{flex:1;position:relative;overflow:hidden;background:#d9d1bd}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--paper);overflow:hidden}

/* ---------- scenes & reveals ---------- */
.scene{position:absolute;inset:0;visibility:hidden;z-index:1;transition:visibility 0s .95s}
.scene.active{visibility:visible;z-index:2;transition:visibility 0s 0s;animation:var(--rev,revCircle) .95s cubic-bezier(.7,0,.2,1) both}
.scene .inner{position:absolute;inset:0}
.scene.active .inner{animation:var(--cam,camIn) 70s linear forwards}
#s0{--rev:revCircle;--cam:camIn} #s1{--rev:revCircle;--cam:camIn} #s2{--rev:revWipe;--cam:camLeft} #s3{--rev:revCircle;--cam:camIn}
#s4{--rev:revDown;--cam:camRight} #s5{--rev:revDiag;--cam:camLeft} #s6{--rev:revWipe;--cam:camIn} #s7{--rev:revCircle;--cam:camRight}
@keyframes camIn{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes camLeft{from{transform:scale(1.02) translateX(0)}to{transform:scale(1.02) translateX(-24px)}}
@keyframes camRight{from{transform:scale(1.02) translateX(-20px)}to{transform:scale(1.02) translateX(6px)}}
@keyframes revCircle{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
@keyframes revWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes revDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes revDiag{from{clip-path:polygon(0 0,0 0,-30% 100%,-30% 100%)}to{clip-path:polygon(0 0,130% 0,100% 100%,-30% 100%)}}

/* ---------- backgrounds: flat pastel + organic shapes + paper dot grid ---------- */
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.4s;overflow:hidden}
.bg.in{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(36,48,73,.11) 1.3px,transparent 1.6px) 0 0/30px 30px}
.blob{position:absolute;opacity:.9;animation:morph 15s ease-in-out infinite alternate}
@keyframes morph{0%{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;translate:0 0}100%{border-radius:40% 60% 45% 55%/60% 40% 60% 40%;translate:36px -26px}}

/* ---------- drawing primitives ---------- */
svg.art{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.dr{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset var(--t,1s) cubic-bezier(.5,0,.3,1)}
.dr.in{stroke-dashoffset:0}
.g{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .45s,transform .85s cubic-bezier(.2,1.35,.4,1),scale .6s,fill .5s}
.g.pop{transform:scale(.15)} .g.up{transform:translateY(70px)} .g.lf{transform:translateX(-120px)} .g.rt{transform:translateX(120px)}
.g.fall{transform:translateY(-640px)} .g.drop{transform:translateY(-300px) rotate(-12deg)}
.g.in{opacity:1;transform:none}
.g.gone{opacity:0;scale:.85}
.fl path{fill:var(--c,#fff);transform:translate(4px,5px)}
.ol path,.ol circle,.ol line{fill:none;stroke:#243049;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.bar{stroke:#243049;stroke-width:3.5;stroke-linejoin:round}
.bub{fill:#fff;stroke:#243049;stroke-width:3.5;stroke-linejoin:round}

/* ---------- text ---------- */
.tx{position:absolute;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .7s cubic-bezier(.2,1.2,.4,1),translate .5s;color:var(--ink);line-height:1.12}
.tx.in{opacity:1;transform:none}
.tx.gone{opacity:0;translate:0 -20px}
.tx.wr{opacity:1;transform:none;clip-path:inset(-30% 101% -30% -3%);transition:clip-path 1.1s cubic-bezier(.5,0,.2,1)}
.tx.wr.in{clip-path:inset(-30% -3% -30% -3%)}
.tx.wr.gone{clip-path:inset(-30% 101% -30% -3%);translate:0 0}
.hd{font-family:Nunito,"Segoe UI",sans-serif;font-weight:900}
.hw{font-family:Caveat,"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-weight:700}
.c{text-align:center}
.hl{background:linear-gradient(transparent 58%,rgba(255,210,90,.75) 58%);padding:0 .1em}
.hlc{background:linear-gradient(transparent 58%,rgba(255,127,99,.5) 58%);padding:0 .1em}
.hlm{background:linear-gradient(transparent 58%,rgba(63,191,152,.45) 58%);padding:0 .1em}
.co{color:var(--coral)} .mi{color:var(--mint)} .sk{color:var(--sky)} .li{color:var(--lilac)} .mu{color:var(--mute)}

/* ---------- meaningful motion ---------- */
@keyframes spin{to{rotate:360deg}}
@keyframes flick{0%,100%{scale:1 1}25%{scale:.92 1.1}50%{scale:1.06 .94}75%{scale:.95 1.08}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .7s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:center}
.truck.alt .wheel{animation:spin .55s linear 4}
.truck{transition:transform 2.3s cubic-bezier(.5,0,.3,1),opacity .45s,scale .6s}
.g.truck.alt{transform:translateX(408px)}
@keyframes wob{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.wobble{transform-box:fill-box;transform-origin:50% 100%;animation:wob 2.4s ease-in-out infinite}

/* tokens (scene 1) */
.tok circle{fill:#fff;stroke:#243049;stroke-width:3.5;transition:fill .5s}
.tok .ck,.tok .xx{fill:none;stroke:#243049;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s}
.g.tok.w.alt circle{fill:#7fe0bd} .g.tok.w.alt .ck{stroke-dashoffset:0}
.g.tok.l.alt circle{fill:#ffd2c6} .g.tok.l.alt .xx{stroke-dashoffset:0}
.g.tok.l.alt{transform:scale(.86)}
.g.tok.w.alt{transform:scale(1.12)}

/* papers (scene 4) */
.pp rect{fill:#fff;stroke:#243049;stroke-width:2;transition:fill .4s}
.pp path{fill:none;stroke:#243049;stroke-width:1.5}
.g.pp{transform:translate(var(--sx),-440px) rotate(var(--sr));transition:opacity .4s,transform 1.2s cubic-bezier(.4,.1,.3,1)}
.g.pp.in{transform:none}
.g.pp.l.alt{opacity:0;transform:translate(var(--lx),460px) rotate(var(--lr))}
.g.pp.k.alt{transform:translate(var(--nx),var(--ny))}
.g.pp.k.alt2{transform:translate(var(--bx),var(--by))}
.pp.k.alt rect{fill:#7fe0bd}

/* bars */
.hb{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.hb.neg{transform-origin:100% 50%}
.hb.in{transform:scaleX(1)}
.vb{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.vb.in{transform:scaleY(1)}
.g.rider{transform:translateX(var(--rx,-200px));transition:opacity .4s,transform 1s cubic-bezier(.3,.7,.2,1)}
.g.rider.in{transform:none}

/* seesaw */
.plank{opacity:0;transition:transform 1.4s cubic-bezier(.4,1.7,.5,1),opacity .5s}
.plank.in{opacity:1}
.plank.alt{transform:rotate(var(--a1,13deg))}
.plank.alt2{transform:rotate(var(--a2,5deg))}
.plank.alt3{transform:rotate(var(--a3,0deg))}
.plank.alt4{transform:rotate(var(--a4,22deg))}

/* rings */
.rgt{fill:none;stroke:rgba(36,48,73,.12);stroke-width:14}
.rg{fill:none;stroke-width:14;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);transition:stroke-dashoffset 1.8s cubic-bezier(.3,.7,.2,1)}
.rg.in{stroke-dashoffset:var(--off)}

/* pack liquids */
.liq{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s ease-in-out}
.res{opacity:0;transition:opacity .6s .5s}
.g.pk{transition:opacity .45s,transform 1s cubic-bezier(.4,1.1,.4,1),scale .6s}
.g.pk.alt .liq{transform:scaleY(.04)}
.g.pk.alt .res{opacity:1}
.g.pk.alt{transform:rotate(-58deg)}
.g.pk.alt.alt2{transform:rotate(0deg)}
.g.pk.alt3,.g.pk.alt3.alt2{transform:translateY(var(--ty,180px)) scale(.5)}
.drain.alt .liq{transform:scaleY(.04)}
.drain.alt .res{opacity:1}
.g.drain.alt{transform:none}

/* subtitles */
#subs{position:absolute;left:0;right:0;bottom:34px;text-align:center;padding:0 90px;z-index:50;pointer-events:none}
#subs span{display:inline-block;background:rgba(255,255,255,.92);color:var(--ink);padding:8px 24px;border-radius:14px;font-size:30px;line-height:1.3;font-weight:800;max-width:1100px;box-shadow:0 4px 18px rgba(36,48,73,.18);border:2px solid var(--ink)}
#subs.off{display:none}
#bar{position:absolute;left:0;bottom:0;height:7px;background:var(--coral);width:0;z-index:60}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:260px;font-weight:900;background:rgba(251,245,232,.92);color:var(--ink);z-index:100}

/* controls */
#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#f4eddc;border-top:1px solid #d8cfb7;font-size:14px;color:var(--ink)}
#ctl button,#ctl select{background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
#ctl button:hover{background:#ffe8a8}
#ctl button.on{background:var(--mint);color:#fff;border-color:var(--ink)}
#seek{flex:1;min-width:200px}
.rec #ctl{display:none}
.rec #viewport{background:#fbf5e8}
#hint{color:var(--mute);font-size:12px;width:100%}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" id="defs"></svg>

<div id="wrap">
<div id="viewport"><div id="stage"><div id="subs"><span></span></div><div id="bar"></div><div id="count">3</div></div></div>
<div id="ctl">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00 / 5:00</span>
  <span id="astat" style="font-weight:700;color:#6b7894">loading audio…</span>
  <span id="scenebtns"></span>
  <button id="subbtn" class="on">Subtitles</button>
  <button id="fs">Fullscreen</button>
  <button id="rec">● Record mode</button>
  <button id="exp" title="Records this tab (video + voice + music) to a .webm file">⬇ Export video</button>
  <div id="hint">Space = play/pause · ← → = previous/next scene · S = subtitles · F = fullscreen · R = record mode (3-2-1 countdown, controls hidden, Esc to exit) · Export video: open in Chrome/Edge, go full screen (F11), click Export video, choose “This tab”</div>
</div>
</div>

<script src="voiceover.js"></script>
<script src="music.js"></script>
<script>
/* ================= ICON LIBRARY (flat colour offset behind an ink outline) ================= */
const BODY={
 plastic:'M40 18h20v10c0 8 20 12 20 36v78c0 10-8 14-18 14H38c-10 0-18-4-18-14V64c0-24 20-28 20-36z',
 glass:'M43 14h14v36c0 14 25 20 25 46v42c0 10-8 14-18 14H36c-10 0-18-4-18-14V96c0-26 25-32 25-46z',
 can:'M28 26h44v116c0 6-4 10-10 10H38c-6 0-10-4-10-10z',
 carton:'M22 60L50 30l28 30v82c0 5-3 8-8 8H30c-5 0-8-3-8-8z',
 pouch:'M26 50h48l8 90c0 6-4 10-10 10H28c-6 0-10-4-10-10z',
 sachet:'M24 44h52v96H24z',
 pump:'M24 74c0-8 6-12 12-12h28c6 0 12 4 12 12v64c0 8-6 12-12 12H36c-6 0-12-4-12-12z',
 canister:'M20 66c0-10 6-16 16-16h30c10 0 16 6 16 16v76c0 8-6 12-14 12H34c-8 0-14-4-14-12z'
};
const DET={
 plastic:['M38 6h24v12H38z','M22 92q14 8 28 0t28 0','M22 116q14 8 28 0t28 0'],
 glass:['M41 4h18v10H41z'],
 can:['M28 26q22 9 44 0','M44 18h12','M28 70h44','M28 108h44'],
 carton:['M43 30V14h14v16','M22 60h56','M50 30v30'],
 pouch:['M42 50V32h16v18','M38 22h24v10H38z','M26 66h48'],
 sachet:['M24 56h52','M24 128h52'],
 pump:['M42 46h16v16H42z','M30 22h40v10H58v14H42V32H30z'],
 canister:['M36 32h26v18H36z','M82 70h6c8 0 10 6 10 12v30c0 6-2 12-10 12h-6']
};
const EXTRA={ glass:'<rect x="26" y="102" width="48" height="32" fill="#fff" opacity=".9"/>' };
function sym(id,vb,fill,out,extra){return `<symbol id="${id}" viewBox="${vb}" overflow="visible"><g class="fl">${fill.map(d=>`<path d="${d}"/>`).join('')}</g>${extra||''}<g class="ol">${out.map(d=>`<path d="${d}"/>`).join('')}</g></symbol>`}
let DEFS='';
for(const k in BODY){
  DEFS+=sym('pk-'+k,'0 0 100 160',[BODY[k]],[BODY[k],...DET[k]],EXTRA[k]);
  DEFS+=`<clipPath id="cp-${k}"><path d="${BODY[k]}"/></clipPath>`;
}
DEFS+=sym('doc','0 0 80 100',['M8 6h46l18 18v70H8z'],['M8 6h46l18 18v70H8z','M54 6v18h18','M20 46h40','M20 60h40','M20 74h24']);
DEFS+=sym('bin','0 0 80 100',['M14 28h52l-5 66H19z'],['M14 28h52l-5 66H19z','M8 22h64','M30 22v-8h20v8','M32 40v40','M48 40v40']);
DEFS+=sym('pile','0 0 110 80',['M4 74c2-20 16-26 26-22 4-18 22-24 34-14 14-6 30 4 28 20 10 2 14 10 14 16z'],['M4 74c2-20 16-26 26-22 4-18 22-24 34-14 14-6 30 4 28 20 10 2 14 10 14 16z','M30 52c4 4 8 4 12 0','M64 38c4 5 10 5 14 0','M20 66h14','M70 64h18']);
DEFS+=sym('flame','0 0 60 80',['M30 4C34 22 52 30 52 52C52 68 42 76 30 76C18 76 8 68 8 52C8 40 16 34 20 24C22 32 26 34 28 34C28 24 28 14 30 4z'],['M30 4C34 22 52 30 52 52C52 68 42 76 30 76C18 76 8 68 8 52C8 40 16 34 20 24C22 32 26 34 28 34C28 24 28 14 30 4z'],'<path d="M30 42c8 8 12 14 12 22c0 8-6 10-12 10s-12-2-12-10c0-8 8-12 12-22z" fill="#ffe27a"/>');
DEFS+=sym('magnifier','0 0 100 100',['M16 40a24 24 0 1 0 48 0a24 24 0 1 0 -48 0'],['M16 40a24 24 0 1 0 48 0a24 24 0 1 0 -48 0','M58 58L88 88']);
DEFS+=sym('funnel','0 0 200 200',['M10 22h180l-66 92v66H76v-66z'],['M10 22h180l-66 92v66H76v-66z']);
DEFS+=sym('coin','0 0 60 60',['M6 30a24 24 0 1 0 48 0a24 24 0 1 0 -48 0'],['M6 30a24 24 0 1 0 48 0a24 24 0 1 0 -48 0','M30 14v32','M38 22h-12a6 6 0 0 0 0 12h8a6 6 0 0 1 0 12h-14']);
DEFS+=sym('star','0 0 60 60',['M30 4l7.5 16.5L55 22l-13 12 3.8 17.5L30 42l-15.8 9.5L18 34 5 22l17.5-1.5z'],['M30 4l7.5 16.5L55 22l-13 12 3.8 17.5L30 42l-15.8 9.5L18 34 5 22l17.5-1.5z']);
DEFS+=sym('pin','0 0 60 80',['M30 76C10 50 6 40 6 28a24 24 0 0 1 48 0c0 12-4 22-24 48z'],['M30 76C10 50 6 40 6 28a24 24 0 0 1 48 0c0 12-4 22-24 48z','M22 28a8 8 0 1 0 16 0a8 8 0 1 0 -16 0']);
DEFS+=sym('flag','0 0 60 80',['M12 8l40 14-40 16z'],['M12 76V6','M12 8l40 14-40 16']);
DEFS+=sym('ruler','0 0 120 40',['M4 6h112v28H4z'],['M4 6h112v28H4z','M20 6v10','M36 6v14','M52 6v10','M68 6v14','M84 6v10','M100 6v14']);
DEFS+=sym('leaf','0 0 60 60',['M6 54C6 22 24 6 54 6c0 28-16 48-48 48z'],['M6 54C6 22 24 6 54 6c0 28-16 48-48 48z','M6 54L36 24']);
DEFS+=sym('truck','0 0 160 90',['M6 14h84v50H6z','M90 28h34l24 20v16H90z'],['M6 14h84v50H6z','M90 28h34l24 20v16H90z','M100 34h18l12 14h-30z'],'<circle cx="36" cy="78" r="11" fill="#fff" stroke="#243049" stroke-width="4"/><circle cx="118" cy="78" r="11" fill="#fff" stroke="#243049" stroke-width="4"/>');
(function(){
  const arcs=['M50 12A38 38 0 0 1 83 69','M83 69A38 38 0 0 1 17 69','M17 69A38 38 0 0 1 50 12'];
  const head='78,77.7 89.1,72.5 76.9,65.5';
  DEFS+=`<symbol id="recycle" viewBox="0 0 100 100" overflow="visible"><g fill="none" style="stroke:var(--c)" stroke-width="9" stroke-linecap="round">${arcs.map(d=>`<path d="${d}"/>`).join('')}</g><g style="fill:var(--c)" stroke="#243049" stroke-width="3" stroke-linejoin="round"><polygon points="${head}"/><polygon points="${head}" transform="rotate(120 50 50)"/><polygon points="${head}" transform="rotate(240 50 50)"/></g></symbol>`;
})();
document.getElementById('defs').innerHTML='<defs>'+DEFS+'</defs>';

/* ================= BUILD HELPERS ================= */
const P={coral:'#ff9a7e',mint:'#7fe0bd',sky:'#8fd0f7',lemon:'#ffe08a',lilac:'#c4b2f7',tan:'#e8c796',silver:'#d5dde8',glass:'#a8e6dc',pink:'#ffb3cf',white:'#ffffff',gold:'#ffd54a',wood:'#e9c98a'};
const INK='#243049';
function din(o){let s='';
  if(o.in!=null)s+=` data-in="${o.in}"`; if(o.out!=null)s+=` data-out="${o.out}"`;
  for(const k of ['alt','alt2','alt3','alt4'])if(o[k]!=null)s+=` data-${k}="${o[k]}"`;
  if(o.cnt)s+=` data-count-cue="${o.cnt[0]}" data-count-to="${o.cnt[1]}" data-count-dur="${o.cnt[2]}" data-count-dec="${o.cnt[3]||0}"`;
  return s}
const G=(inner,o={})=>`<g class="g ${o.c||'pop'} ${o.x||''}"${din(o)}${o.st?` style="${o.st}"`:''}>${inner}</g>`;
const U=(id,x,y,w,h,col)=>`<use href="#${id}" x="${x}" y="${y}" width="${w}" height="${h}" style="--c:${col}"/>`;
const PK=(kind,x,y,w,col,o={})=>G(U('pk-'+kind,x,y,w,w*1.6,col),o);
const T=(html,x,y,o={})=>`<div class="tx ${o.c||''}" style="left:${x}px;top:${y}px;${o.w?`width:${o.w}px;`:''}font-size:${o.s||28}px;${o.col?`color:${o.col};`:''}${o.rot?`rotate:${o.rot}deg;`:''}${o.st||''}"${din(o)}>${html}</div>`;
const D=(d,o={})=>`<path class="dr" d="${d}" pathLength="1" style="stroke:${o.col||INK};stroke-width:${o.w||4};--t:${o.t||1}s"${din(o)}/>`;
const circ=(cx,cy,r)=>`M${cx+r} ${cy}a${r} ${r} 0 1 1 ${-2*r} 0a${r} ${r} 0 1 1 ${2*r} 0`;
const BG=(base,blobs,o)=>`<div class="bg" style="background:${base}"${din(o)}>${blobs.map(b=>`<div class="blob" style="left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px;background:${b[4]};animation-delay:${b[5]||0}s"></div>`).join('')}</div>`;
const KICK=(label,col)=>T(label,60,22,{c:'hw',s:38,col,in:0.3,wr:1})+`<svg class="art" style="pointer-events:none">${D(`M60 68q${label.length*3} -9 ${label.length*7} 0t${label.length*7} -2`,{col,w:5,in:0.8})}</svg>`;
function bubble(x,y,w,h,tx){return `M${x+14} ${y}H${x+w-14}a14 14 0 0 1 14 14V${y+h-14}a14 14 0 0 1 -14 14H${tx+16}l-12 16l-4 -16H${x+14}a14 14 0 0 1 -14 -14V${y+14}a14 14 0 0 1 14 -14z`}
const LQ={pump:[62,150],sachet:[44,140],pouch:[50,150],canister:[50,154]};
function PKL(kind,x,y,w,col,o={}){
  const [top,bot]=LQ[kind]; const s=w/100;
  return `<g transform="translate(${x},${y}) scale(${s})">${G(`${U('pk-'+kind,0,0,100,160,col)}<g clip-path="url(#cp-${kind})"><rect class="liq" x="0" y="${top}" width="100" height="${bot-top}" fill="#ff9fc4"/><rect class="res" x="0" y="${bot-13}" width="100" height="16" fill="#ff9fc4"/></g>`,o)}</g>`;
}
const art=(inner)=>`<svg class="art" viewBox="0 0 1280 720">${inner}</svg>`;
function seesaw(id,cx,py,len,angles,items,o={}){
  const x0=cx-len/2;

/* ================= VOICE-OVER SCRIPT (also the subtitles) ================= */
const WPM = 122;
const SCENES = [
 {id:'s0', name:'Title', fixed:4, vo:''},
 {id:'s1', name:'Hook', vo:`Picture a [[bottles]]plastic bottle and a glass bottle. Which one is better for the planet? Almost everyone says [[glass]]glass. We checked [[n31]]thirty-one real comparisons from published studies. Replacements for plastic had a lower carbon footprint in only [[n13]]thirteen of them. So, is [[q]]“plastic-free” really greener?`},
 {id:'s2', name:'Problem', vo:`Governments and brands are pushing to replace plastic with [[m1]]glass, [[m2]]aluminium, [[m3]]cartons and [[m4]]refills. The carbon case comes from life cycle assessments. But these studies have [[probs]]three problems. One: they [[p1]]disagree with each other. Two: they assume [[p2]]European waste systems, where most material is recycled, while in India a lot of waste is never collected. Three: they measure the pack per kilogram of product [[p3]]filled, not per kilogram actually used.`},
 {id:'s3', name:'Approach', vo:`So we asked three questions. [[h1]]One: is replacement packaging actually lower in carbon than the plastic it replaces? [[h2]]Two: does that change under Indian collection rates? [[h3]]Three: does the answer change if we count the product left stuck in the pack? We built [[stages]]three stages to answer them: a meta-analysis, a recycling model, and an honest functional unit.`},
 {id:'s4', name:'Stage 1', vo:`In stage one we screened [[f90]]ninety records and kept [[f24]]twenty-four reports. Instead of comparing averages across different studies, we only compared packs [[within]]inside the same study, where both used the same assumptions. That gave us [[f31]]thirty-one pairs from sixteen studies. The result: on average, the alternative had [[avg]]1.38 times the footprint of plastic. But it depends on the material. [[carton]]Cartons beat plastic in all nine pairs, at 0.63 times. [[reuse]]Reusable glass is close to a tie. [[glass]]Single-use glass is 2.6 times worse and [[alu]]aluminium is 2.5 times worse. Then a [[twist]]twist. When a study was paid for by a material maker, that material came out best in [[spons]]four of five studies. And values copied from an [[ind]]industry-compiled table looked twenty-six percent kinder to alternatives than the original papers.`},
 {id:'s5', name:'Stage 2', vo:`Stage two moves to [[india]]India. We built a simulation of a beverage can, a PET bottle and a glass bottle, using Indian recycling rates: eighty-five percent for aluminium, seventy for PET. In [[eu]]Europe, an aluminium can has 1.73 times the footprint of PET. In [[inr]]India, that penalty shrinks to 1.16. Better, but still not a win. Aluminium only matches PET if about [[par]]eighty-nine percent of cans are collected, and India is at [[ind85]]eighty-five. So close, and yet not there. [[gl]]Glass stays about five times worse than PET at any collection rate.`},
 {id:'s6', name:'Stage 3', vo:`Stage three is our favourite. Every packaging study we found counts a pack per kilogram of shampoo [[filled]]filled. But product that stays stuck inside the pack is [[waste]]wasted, and its carbon is wasted too. Using measured residue data from published studies, we scored four shampoo packs: a [[sachet]]sachet, a [[pump]]pump bottle, a [[pouch]]refill pouch and a [[can]]two-litre canister. When we charged each pack for the product it strands, [[up]]every footprint went up, by thirty-eight to one hundred twenty-one percent. The big canister, which [[tie]]tied with the refill pouch on the usual measure, [[lost]]lost by 1.4 times once leftovers were counted. And the sachet, usually the villain, turned out to be only partly worse than a pump bottle. [[pw]]Refill pouches won either way.`},
 {id:'s7', name:'Conclusion', vo:`So what did we learn? Plastic replacement is not automatically greener. [[c1]]Cartons reliably win, reuse helps, and single-use glass and aluminium usually lose. In India, [[c2]]collection rates change the answer, especially for aluminium. And packaging should be judged [[c3]]per unit of product actually used, under local waste systems, with independent evidence. Next time someone says [[q]]“plastic-free,” ask: compared to what, where, and who paid for the study? [[thx]]Thank you.`}
];

/* ---------------- Timeline construction (uses the real voice timings when voiceover.js is present) ---------------- */
const LEAD = 0.8, TAIL = 1.0, TITLE_LEN = 5.5;
SCENES[0].fixed = TITLE_LEN;
SCENES[SCENES.length-1].tail = 3.4;           // room for the music to swell and fade after the last word
let TOTAL = 0;
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g,'');
function alignWords(vod, wl){
  const B = vod.words, subsB = B.map(b=>b[2].split(/\s+/).map(norm).filter(Boolean));
  const st=[], en=[]; let j=0,k=0;
  wl.forEach(()=>{
    while(j<B.length && subsB[j].length===0) j++;
    if(j>=B.length){ const l=en.length?en[en.length-1]:0; st.push(l); en.push(l+.25); return }
    const n=subsB[j].length, t=B[j][0], d=B[j][1];
    st.push(t+k/n*d); en.push(t+(k+1)/n*d);
    if(++k>=n){ j++; k=0 }
  });
  return {st,en};
}
SCENES.forEach(sc=>{
  const re=/\[\[(\w+)\]\]/g; let m,last=0,raw='';sc.marks={};
  while((m=re.exec(sc.vo))){raw+=sc.vo.slice(last,m.index);sc.marks[m[1]]=raw.length;last=re.lastIndex}
  raw+=sc.vo.slice(last); sc.plain=raw.replace(/\s+/g,' ').trim();
  const wl=sc.plain?sc.plain.split(' '):[]; sc.words=wl.length;
  sc.vod=(window.VO_DATA&&window.VO_DATA[sc.id])||null;
  let st=[],en=[],audioDur=0;
  if(sc.vod && sc.words){ ({st,en}=alignWords(sc.vod,wl)); audioDur=sc.vod.dur; }
  else if(sc.words){ audioDur=sc.words/WPM*60; const L=sc.plain.length; let pos=0;
    wl.forEach(w=>{ st.push(pos/L*audioDur); pos+=w.length+1; en.push(Math.min(pos,L)/L*audioDur) }); }
  sc.audioDur=audioDur;
  sc.dur=sc.fixed||(LEAD+audioDur+(sc.tail||TAIL));
  sc.start=TOTAL; TOTAL+=sc.dur; sc.end=TOTAL;
  sc.el=document.getElementById(sc.id);
  sc.cue={start:0,x9:9999};
  for(const k in sc.marks){
    const wi=Math.min(raw.slice(0,sc.marks[k]).trim().split(/\s+/).filter(Boolean).length, st.length-1);
    sc.cue[k]=Math.max(0.2,LEAD+(st[wi]||0)-0.12);
  }
  let sents=sc.plain?(sc.plain.match(/[^.?!:]+[.?!:]+["”]?\s*|[^.?!:]+$/g)||[sc.plain]):[];
  let chunks=[];
  sents.forEach(s=>{s=s.trim(); while(s.length>78){const mid=s.length/2; let cut=-1,best=1e9; for(let i=0;i<s.length;i++){ if(s[i]===' '){ const d=Math.abs(i-mid)-(s[i-1]===','?14:0); if(d<best){best=d;cut=i} } } chunks.push(s.slice(0,cut).trim()); s=s.slice(cut+1).trim()} if(s)chunks.push(s)});
  let w0=0; sc.subs=chunks.map(c=>{const n=c.split(' ').length, w1=Math.min(w0+n-1,en.length-1); const o={a:LEAD+st[Math.min(w0,st.length-1)]-0.05,b:LEAD+en[w1]+0.1,t:c}; w0+=n; return o});
  sc.subs.forEach((o,i)=>{ if(sc.subs[i+1]) o.b=Math.max(o.b,sc.subs[i+1].a-0.05) });
});

function parseT(sc,expr){
  if(expr==null||expr==='')return null;
  let m=expr.match(/^([a-z][\w]*)(?:([+-])([\d.]+))?$/i);
  if(m){ const base=sc.cue[m[1]]; if(base==null){console.warn('unknown cue',expr,sc.id);return 0} return base+(m[2]==='-'?-1:1)*(m[3]?parseFloat(m[3]):0) }
  return parseFloat(expr);
}
SCENES.forEach(sc=>{
  sc.els=[...sc.el.querySelectorAll('[data-in],[data-alt],[data-alt2],[data-alt3],[data-alt4],[data-count-cue]')].map(el=>({
    el, hasIn:el.dataset.in!==undefined, tin:parseT(sc,el.dataset.in), tout:parseT(sc,el.dataset.out),
    talt:[el.dataset.alt,el.dataset.alt2,el.dataset.alt3,el.dataset.alt4].map(v=>parseT(sc,v)),
    ccue:el.dataset.countCue?parseT(sc,el.dataset.countCue):null,
    cto:parseFloat(el.dataset.countTo||0), cdur:parseFloat(el.dataset.countDur||1), cdec:parseInt(el.dataset.countDec||0),
    cv:el.querySelector('.cv')
  }));
});

/* ---------------- Rendering ---------------- */
const $=id=>document.getElementById(id);
const subs=$('subs'), subSpan=subs.querySelector('span');
const ALTC=['alt','alt2','alt3','alt4'];
function fmt(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function render(t){
  t=Math.min(Math.max(t,0),TOTAL-0.001);
  let idx=SCENES.findIndex(s=>t>=s.start&&t<s.end); if(idx<0)idx=SCENES.length-1;
  SCENES.forEach((s,i)=>s.el.classList.toggle('active',i===idx));
  const sc=SCENES[idx], lt=t-sc.start;
  sc.els.forEach(o=>{
    let on = o.tin==null? true : lt>=o.tin;
    const gone = o.tout!=null && lt>=o.tout;
    if(gone) on=false;
    if(o.hasIn){ o.el.classList.toggle('in',on); o.el.classList.toggle('gone',gone&&o.tin!=null&&lt>=o.tin); }
    o.talt.forEach((ta,i)=>{ if(ta!=null) o.el.classList.toggle(ALTC[i],lt>=ta) });
    if(o.cv&&o.ccue!=null){ const p=Math.min(1,Math.max(0,(lt-o.ccue)/o.cdur)); const e=1-Math.pow(1-p,3); o.cv.textContent=(o.cto*e).toFixed(o.cdec) }
  });
  const sub=sc.subs.find(s=>lt>=s.a&&lt<s.b);
  subSpan.textContent=sub?sub.t:''; subSpan.style.display=sub?'inline-block':'none';
  $('bar').style.width=(t/TOTAL*100)+'%';
  $('time').textContent=fmt(t)+' / '+fmt(TOTAL);
  $('seek').value=Math.round(t/TOTAL*1000);
  document.querySelectorAll('#scenebtns button').forEach((b,i)=>b.classList.toggle('on',i===idx));
}

const setStatus=t=>{ $('astat').textContent=t };
function mtof(n){ return 440*Math.pow(2,(n-69)/12) }

function b64buf(b64){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer }
/* music level over the timeline: loud for the title, low under the voice, swells after the last word */
function musicLevel(t){
  const last=SCENES[SCENES.length-1], vs=SCENES[1].start+LEAD-0.4, vEnd=last.start+LEAD+last.audioDur;
  const pts=[[0,0],[1.8,.9],[vs-1.0,.9],[vs+0.9,.14],[vEnd,.14],[vEnd+1.4,.75],[TOTAL-1.6,.75],[TOTAL+1.2,0]];
  return pts;
}
async function initAudio(){
  try{
    ACTX=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ACTX.createDynamicsCompressor(); comp.threshold.value=-22; comp.ratio.value=3; comp.attack.value=.01; comp.release.value=.25;
    MASTER=ACTX.createGain(); MASTER.connect(comp); comp.connect(ACTX.destination);
    RECDEST=ACTX.createMediaStreamDestination(); comp.connect(RECDEST);
    setStatus('decoding voice…');
    for(const sc of SCENES){ if(sc.vod) VBUF[sc.id]=await ACTX.decodeAudioData(b64buf(sc.vod.a)) }
    setStatus('decoding music…');
    if(window.MUSIC_DATA) MBUF=await ACTX.decodeAudioData(b64buf(window.MUSIC_DATA));
    audioState='ready';
    setStatus((Object.keys(VBUF).length?'♪ voice':'no voice (voiceover.js missing)')+' + '+(MBUF?'music ready':'no music (music.js missing)'));
  }catch(e){ audioState='failed'; console.error(e); setStatus('audio unavailable'); }
}
function stopAudio(){ SRC.forEach(s=>{try{s.stop()}catch(e){}}); SRC=[] }
function startAudio(){
  stopAudio(); if(!ACTX||audioState!=='ready')return;
  const now=ACTX.currentTime+0.08; aBase={ctx:now,clock};
  if(MBUF && clock<MBUF.duration-0.05){
    const s=ACTX.createBufferSource(), mg=ACTX.createGain(), pts=musicLevel();
    let v0=0; for(let i=0;i<pts.length-1;i++){ if(clock>=pts[i][0]&&clock<=pts[i+1][0]) v0=pts[i][1]+(pts[i+1][1]-pts[i][1])*(clock-pts[i][0])/(pts[i+1][0]-pts[i][0]) }
    mg.gain.setValueAtTime(v0,now); pts.forEach(([t,v])=>{ if(t>clock) mg.gain.linearRampToValueAtTime(v,now+(t-clock)) });
    s.buffer=MBUF; s.connect(mg); mg.connect(MASTER); s.start(now,clock); SRC.push(s) }
  SCENES.forEach(sc=>{
    const b=VBUF[sc.id]; if(!b)return; const t0=sc.start+LEAD; if(t0+b.duration<=clock)return;
    const s=ACTX.createBufferSource(), g=ACTX.createGain(); s.buffer=b; g.gain.value=1.25; s.connect(g); g.connect(MASTER);
    s.start(now+Math.max(0,t0-clock),Math.max(0,clock-t0)); SRC.push(s);
  });
}

/* ---------------- Clock ---------------- */
let clock=0, playing=false, last=0;
function tick(now){
  if(playing){
    if(SRC.length) clock=aBase.clock+Math.max(0,ACTX.currentTime-aBase.ctx); else clock+=(now-last)/1000;
    last=now; if(clock>=TOTAL){clock=TOTAL-0.001;setPlaying(false)} render(clock)
  }
  requestAnimationFrame(tick)
}
function setPlaying(p){ playing=p; last=performance.now(); $('play').textContent=p?'❚❚ Pause':'▶ Play'; if(p)startAudio(); else stopAudio() }
function seek(t){ clock=Math.min(Math.max(t,0),TOTAL-0.001); render(clock); if(playing)startAudio() }
async function resumeAudio(){ if(ACTX&&ACTX.state!=='running'){ try{await ACTX.resume()}catch(e){} } }
$('play').onclick=async()=>{ await resumeAudio(); if(clock>=TOTAL-0.01)seek(0); setPlaying(!playing) };
$('seek').oninput=e=>seek(e.target.value/1000*TOTAL);
SCENES.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=i===0?'T':i; b.title=s.name; b.onclick=()=>seek(s.start+0.01); $('scenebtns').appendChild(b) });
$('subbtn').onclick=()=>{ subs.classList.toggle('off'); $('subbtn').classList.toggle('on') };
$('fs').onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen() };

function curScene(){ return SCENES.findIndex(s=>clock>=s.start&&clock<s.end) }
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();$('play').click()}
  else if(e.key==='ArrowRight'){const i=curScene();seek(SCENES[Math.min(i+1,SCENES.length-1)].start+0.01)}
  else if(e.key==='ArrowLeft'){const i=curScene();seek(SCENES[(clock-SCENES[i].start>2)?i:Math.max(0,i-1)].start+0.01)}
  else if(e.key==='s'||e.key==='S')$('subbtn').click();
  else if(e.key==='f'||e.key==='F')$('fs').click();
  else if(e.key==='r'||e.key==='R')startRecord();
  else if(e.key==='Escape')endRecord();
});

let cdTimer=null;
async function startRecord(auto){
  await resumeAudio();
  setPlaying(false); seek(0); document.body.classList.add('rec'); fit();
  const c=$('count'); c.style.display='flex'; let n=3; c.textContent=n;
  clearInterval(cdTimer);
  cdTimer=setInterval(()=>{ n--; if(n>0){c.textContent=n} else { clearInterval(cdTimer); c.style.display='none'; setPlaying(true) } },1000);
}
function endRecord(){ clearInterval(cdTimer); $('count').style.display='none'; document.body.classList.remove('rec'); setPlaying(false); fit() }
$('rec').onclick=()=>startRecord();

/* Export: records this browser tab (picture) + the mixed voice/music (sound) into a .webm file */
$('exp').onclick=async()=>{
  try{
    if(audioState!=='ready'){ alert('Audio is still preparing – wait for "voice + music ready".'); return }
    await resumeAudio();
    const disp=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'});
    const mix=new MediaStream([...disp.getVideoTracks(),...RECDEST.stream.getAudioTracks()]);
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    const rec=new MediaRecorder(mix,{mimeType:mime,videoBitsPerSecond:9e6,audioBitsPerSecond:192000}), chunks=[];
    rec.ondataavailable=e=>{ if(e.data&&e.data.size)chunks.push(e.data) };
    rec.onstop=()=>{ disp.getTracks().forEach(t=>t.stop()); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})); a.download='UNWRAP_video.webm'; document.body.appendChild(a); a.click(); a.remove(); endRecord() };
    disp.getVideoTracks()[0].onended=()=>{ if(rec.state!=='inactive')rec.stop() };
    rec.start(1000);
    await startRecord();
    const watch=setInterval(()=>{ if(clock>=TOTAL-0.05 && !playing){ clearInterval(watch); setTimeout(()=>{ if(rec.state!=='inactive')rec.stop() },700) } },300);
  }catch(e){ console.warn(e); endRecord(); alert('Export was cancelled or is not supported in this browser. You can still use Record mode with a screen recorder.') }
};
function fit(){
  const v=$('viewport'), w=v.clientWidth, h=v.clientHeight, s=Math.min(w/1280,h/720);
  const st=$('stage'); st.style.transform=`scale(${s})`; st.style.left=((w-1280*s)/2)+'px'; st.style.top=((h-720*s)/2)+'px';
}
window.addEventListener('resize',fit); fit();

render(0); requestAnimationFrame(t=>{last=t;tick(t)}); initAudio();
document.title='UNWRAP Video ('+fmt(TOTAL)+')';
</script>
